# Multiplayer relay for Open World (Cloudflare Workers + Durable Objects, free plan).
# Local test: npx wrangler dev        Deploy: npx wrangler deploy
name = "open-world-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
